---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: blue-zirconium
# description will be included in the image's metadata
description: Bluefin DX with niri + DankMaterialShell
# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/ublue-os/bluefin-dx
image-version: latest # latest is also supported if you want new updates ASAP
# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  # Step 1
  - type: script
    scripts:
      - detect-gnome-removals.sh
  - type: script
    snippets:
      - |
        if [ -f /usr/share/ublue-os/user-setup.hooks.d/10-theming.sh ]; then
          mv /usr/share/ublue-os/user-setup.hooks.d/10-theming.sh{,.disabled}
        fi
  # Step 2
  - type: dnf
    repos:
      copr:
        - yalter/niri-git
        - avengemedia/dms-git
        - avengemedia/danklinux
    install:
      packages:
        - niri
        - xwayland-satellite
        - dms
        - dms-cli
        - dms-greeter
        - dgop
        - danksearch
        - greetd
        - greetd-selinux
        - foot
        - wl-clipboard
        - wtype
        - waypipe
        - brightnessctl
        - iio-sensor-proxy
        - swappy
        - fcitx5
        - fcitx5-mozc
        - qt6ct
        - qt6-qtimageformats
        - playerctl
        - cava
        - udiskie
        - xdg-desktop-portal-gtk
  # Step 3
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /
  # Step 5: Fix PAM for greetd + DMS
  - type: script
    snippets:
      - |
        sed -i '/gnome_keyring.so/ s/-auth/auth/; /gnome_keyring.so/ s/-session/session/' /etc/pam.d/greetd
        cp /usr/share/quickshell/dms/assets/pam/* /usr/lib/pam.d/
  # Step 6: Enable systemd presets
  - type: script
    snippets:
      - systemctl preset greetd.service
      - systemctl preset docker.socket
      - systemctl preset podman.socket
  # Step 7: Validate
  - type: script
    snippets:
      - stat /usr/bin/niri
      - stat /usr/bin/dms
      - stat /usr/bin/greetd
      - stat /usr/bin/foot
      - |
        echo "=== Checking removals ==="
        for pkg in gnome-shell gnome-settings-daemon gdm; do
          if rpm -q "$pkg" >/dev/null 2>&1; then
            echo "$pkg: STILL PRESENT"
          else
            echo "$pkg: removed ✓"
          fi
        done
        echo "=== Checking keeps ==="
        for pkg in gnome-keyring nautilus xdg-desktop-portal-gnome; do
          if rpm -q "$pkg" >/dev/null 2>&1; then
            echo "$pkg: present ✓"
          else
            echo "$pkg: MISSING"
          fi
        done
  - type: default-flatpaks
    configurations:
      - notify: true # Send notification after install/uninstall is finished (true/false)
        scope: system
        # If no repo information is specified, Flathub will be used by default
        install: # system flatpaks we want all users to have and not remove
          - app.zen_browser.zen
          - com.calibre_ebook.calibre
      - scope: user # Also add Flathub user repo, but no user packages
  - type: signing # this sets up the proper policy & signing files for signed images to work fully
